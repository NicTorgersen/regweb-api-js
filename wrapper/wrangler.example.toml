name = "regweb-auth-proxy"
main = "index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
API_KEYS = "your api keys here"
REGWEB_BASE_URL = "https://namespace.regweb.no"
# Set the actual secrets via CLI:
#   wrangler secret put REGWEB_CLIENT_ID
#   wrangler secret put REGWEB_CLIENT_SECRET

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
